<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Creator - Histórico</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/fontawesome.css">
  <link rel="stylesheet" href="./css/animate.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/historico.css">

  <link rel="icon" href="./img/logo.ico" type="x-icon">
  <link rel="shortcut icon" href="./img/logo.ico" type="x-icon">
  <meta property="og:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta property="og:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta property="og:image" content="https://menucreator.com.br/img/logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta name="twitter:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta name="twitter:image" content="https://menucreator.com.br/img/logo.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P70972ZVPQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P70972ZVPQ');
  </script>
</head>
<body>
  <!-- loader-full -->
  <div class="loader-full hidden">
    <img src="./img/loader.png" width="100">
  </div>

  <div class="bg-top pedido"></div>

  <header class="width-fix mt-3">
    <div class="card">
      <div class="d-flex">

        <a href="./perfil.html" class="container-voltar">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div class="infos text-center">
          <h1 class="mb-0"><b>Meu Histórico</b></h1>
        </div>
      </div>
    </div>
  </header>

  <section class="width-fix mt-4">
    <div class="tabs-historico">
      <button class="tab-historico active" data-tab="pedidos">
        <i class="fas fa-utensils"></i> Pedidos
      </button>

      <button class="tab-historico" data-tab="fidelidade">
        <i class="fas fa-gift"></i> Fidelidade
      </button>
    </div>
  </section>

  <!-- TAB PEDIDOS -->
  <section class="pedido width-fix mt-4 tab-content-historico active" id="tab-pedidos">
    <div class="hidden" id="containerNenhumPedido">
      <div class="card card-status-pedido">
        <div class="img-icon-details">
          <i class="fas fa-utensils"></i>
        </div>
        <div class="infos">
          <p class="name mb-1"><b>Nenhum pedido passado</b></p>
          <span class="text mb-0">Você ainda não possui um histórico de pedidos.</span>
        </div>
      </div>
    </div>

    <div id="listaPedidosHistorico" class="mb-5 pb-5">
      <!-- Pedidos renderizados aqui -->
    </div>
  </section>

  <!-- TAB FIDELIDADE -->
  <section class="pedido width-fix mt-4 tab-content-historico" id="tab-fidelidade">
    <div class="hidden" id="containerNenhumBeneficio">
      <div class="card card-status-pedido">
        <div class="img-icon-details">
          <i class="fas fa-gift"></i>
        </div>
        <div class="infos">
          <p class="name mb-1"><b>Sem movimentações</b></p>
          <span class="text mb-0">Você ainda não tem histórico de pontos ou cashback.</span>
        </div>
      </div>
    </div>

    <div id="listaBeneficiosHistorico" class="mb-5 pb-5">
      <!-- Beneficios renderizados aqui -->
    </div>
  </section>

   <section class="menu-bottom" id="menu-bottom">

    <!-- CARDÁPIO -->
    <a href="./index.html" class="menu-bottom-item">
      <i class="fas fa-book-open"></i><br>
      <small>Cardápio</small>
    </a>

    <!-- PEDIDO -->
    <a href="./pedido.html" class="menu-bottom-item">
      <i class="fas fa-utensils"></i><br>
      <small>Pedido</small>
    </a>

    <!-- CARRINHO -->
    <a href="./carrinho.html" class="menu-bottom-item">
      <span id="icone-carrinho-vazio">
        <i class="fas fa-shopping-cart"></i>
      </span>

      <span id="total-carrinho" class="badge-total-carrinho hidden"></span>
      <br>

      <small>Carrinho</small>
    </a>

    <!-- PERFIL / LOGIN -->
    <a href="./login.html" class="menu-bottom-item active">
      <i class="fas fa-user-circle"></i><br>
      <small>Perfil</small>
    </a>

  </section>

  <script type="text/javascript" src="./js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="./js/app.js"></script>
  <script type="text/javascript" src="./js/historico.js"></script>

</body>
</html>
