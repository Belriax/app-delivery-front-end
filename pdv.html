<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>PDV - Frente de Caixa</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/fontawesome.css">
  <link rel="stylesheet" href="../css/animate.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="./css/painel.css">
  <style>
    body { margin: 0; overflow: hidden; }
    .pdv-container { display: flex; height: 100vh; width: 100vw; }
    
    .produtos-section { flex: 7; padding: 20px; overflow-y: auto; background: transparent; }
    .carrinho-section { flex: 3; background: #fff; border-left: 2px solid #e0e0e0; display: flex; flex-direction: column; box-shadow: -2px 0 10px rgba(0,0,0,0.05); z-index: 10; }
    
    .carrinho-header { padding: 20px; border-bottom: 2px solid #f0f0f0; background: #fafafa; }
    .carrinho-itens { flex: 1; overflow-y: auto; padding: 15px; background: #fff; }
    .carrinho-footer { padding: 20px; border-top: 2px solid #f0f0f0; background: #fafafa; }
    
    .produto-card { border: 1px solid #eaeaea; border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; height: 100%; display: flex; flex-direction: column; justify-content: space-between;}
    .produto-card:hover { border-color: var(--color-primary); box-shadow: 0 5px 15px rgba(245,134,55,0.2); transform: translateY(-3px); }
    .produto-card img { max-width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .produto-preco { color: var(--color-primary); font-weight: bold; font-size: 18px; margin-top: 10px; }
    
    /* Mesas Grid Mini no PDV */
    .mesas-grid-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 8px; margin-top: 10px; max-height: 150px; overflow-y: auto; padding-right: 5px; }
    .mesa-card-mini { background: #f0f0f0; border-radius: 6px; padding: 10px 2px; text-align: center; font-weight: bold; font-size: 14px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
    .mesa-card-mini.livre { background: #e8f5e9; color: #2e7d32; border-color: #c8e6c9; }
    .mesa-card-mini.ocupada { background: #ffebee; color: #c62828; border-color: #ffcdd2; }
    .mesa-card-mini.fechando { background: #fff9c4; color: #f57f17; border-color: #fbc02d; animation: pulse-border 1.5s infinite alternate; }
    .mesa-card-mini.selecionada { border-color: #333; transform: scale(1.05); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    
    @keyframes pulse-border {
      from { border-color: #fbc02d; box-shadow: 0 0 0 rgba(251, 192, 45, 0.4); }
      to { border-color: #f57f17; box-shadow: 0 0 12px rgba(251, 192, 45, 0.8); }
    }

    
    .item-carrinho { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #eee; }
    .item-carrinho:last-child { border-bottom: none; }
    .item-qtd { background: #f0f0f0; padding: 2px 8px; border-radius: 4px; font-size: 14px; font-weight: bold; }
    
    .btn-remover-item { color: #dc3545; cursor: pointer; background: none; border: none; padding: 0 5px; }
    
    .categoria-btn { margin-right: 10px; margin-bottom: 10px; border-radius: 20px; padding: 5px 15px; font-weight: 500; }

    /* Toast de Notificação do Garçom */
    .toast-container-pdv { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
    .toast-notificacao { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 320px; overflow: hidden; pointer-events: auto; transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border: 2px solid #fbc02d; }
    .toast-notificacao.show { transform: translateX(0); }
    .toast-header-custom { background: linear-gradient(135deg, #fbc02d, #f57f17); color: white; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
    .toast-header-custom h6 { margin: 0; font-weight: bold; font-size: 15px; }
    .toast-body-custom { padding: 15px; background: #fff; }
  </style>
</head>
<body>
  <div class="pdv-container">
    <div class="produtos-section">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="title-page mb-0" style="font-weight: 800;"><i class="fas fa-store color-primary"></i> PDV Rápido</h2>
        <div class="w-50">
          <div class="input-group">
            <div class="input-group-prepend">
              <span class="input-group-text bg-white border-right-0"><i class="fas fa-search text-muted"></i></span>
            </div>
            <input type="text" class="form-control border-left-0" placeholder="Buscar produto... (F2)" id="txtBuscaProduto">
          </div>
        </div>
        <a href="./home.html" class="btn btn-light shadow-sm"><i class="fas fa-arrow-left"></i> Painel</a>
      </div>
      
      <div class="mb-4" id="lista-categorias-pdv">
        <!-- Categorias injetadas aqui -->
      </div>
      
      <div class="row" id="lista-produtos-pdv">
        <div class="col-12 text-center mt-5">
          <div class="spinner-border color-primary" role="status"></div>
          <p class="mt-2 text-muted">Carregando produtos...</p>
        </div>
      </div>
    </div>
    
    <div class="carrinho-section">
      <div class="carrinho-header">
        <h4 class="title-page mb-3" style="font-weight: 700;">Pedido Atual</h4>
        <select class="form-control mb-2 bg-light font-weight-bold" id="ddlTipoPedido" onchange="pdv.method.mudarTipoPedido()">
          <option value="2">Balcão / Retirada</option>
          <option value="3">Consumo Local (Mesa)</option>
          <option value="1">Delivery</option>
        </select>
        
        <div id="container-mesa" class="d-none mb-2">
          <label class="font-weight-bold mb-1" style="font-size: 14px;">Selecione a Mesa:</label>
          <div id="pdv-mesas-grid" class="mesas-grid-mini">
            <div class="text-center w-100 text-muted" style="grid-column: 1 / -1;"><small>Carregando mesas...</small></div>
          </div>
          <input type="hidden" id="txtNumeroMesa">
        </div>
        
        <input type="text" class="form-control" id="txtNomeCliente" placeholder="Nome do Cliente (Opcional)">
      </div>
      
      <div class="carrinho-itens" id="itens-carrinho-pdv">
        <div class="text-center text-muted mt-5" id="carrinho-vazio">
          <i class="fas fa-shopping-basket fa-3x mb-3" style="opacity: 0.2;"></i>
          <p>Adicione itens ao pedido.</p>
        </div>
      </div>
      
      <div class="carrinho-footer">
        <div class="d-flex justify-content-between mb-2 text-muted font-weight-bold">
          <span>Itens:</span>
          <span id="lblQtdItens">0</span>
        </div>
        <div class="d-flex justify-content-between mb-3">
          <span class="h5 mb-0 font-weight-bold">Total:</span>
          <h3 id="lblTotal" class="color-primary mb-0 font-weight-bold">R$ 0,00</h3>
        </div>
        <select class="form-control mb-3 font-weight-bold" id="ddlFormaPagamento" onchange="pdv.method.mudarFormaPagamento()">
          <option value="1">Dinheiro</option>
          <option value="2">Cartão de Crédito</option>
          <option value="3">Cartão de Débito</option>
          <option value="4">PIX</option>
        </select>
        
        <div id="container-troco" class="mb-3 p-2 bg-light rounded border">
          <small class="font-weight-bold text-muted d-block mb-1">Valor Recebido (R$)</small>
          <input type="number" class="form-control form-control-sm mb-1 text-center font-weight-bold" id="txtValorRecebido" placeholder="0,00" onkeyup="pdv.method.calcularTroco()">
          <div class="d-flex justify-content-between align-items-center mt-1">
            <small class="font-weight-bold">Troco:</small>
            <strong id="lblTroco" class="text-success" style="font-size: 16px;">R$ 0,00</strong>
          </div>
        </div>
        <button class="btn btn-yellow btn-block btn-lg font-weight-bold shadow-sm" id="btnFinalizarPedido" onclick="pdv.method.finalizarPedido()">
          <i class="fas fa-check-circle"></i> Finalizar Pedido
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL PRODUTO DETALHES (OPCIONAIS E VARIACOES) -->
  <div class="modal fade modal-produto-detalhes" id="modalProdutoDetalhes" tabindex="-1" role="dialog" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" role="document" style="max-width: 500px;">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-weight-bold" id="lblNomeProdutoModal">Detalhes do Produto</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
          <!-- Lista de Variações -->
          <div id="listaVariacoesModal" class="hidden mb-4"></div>
          <!-- Lista de Opcionais -->
          <div id="listaOpcionaisModal" class="mb-4"></div>
          <!-- Lista de Opcionais Simples -->
          <div id="listaOpcionaisSimplesModal"></div>
          
          <div class="form-group mt-3">
            <label><b>Observação</b></label>
            <textarea id="txtObservacaoProduto" class="form-control" rows="2" placeholder="Ex: Tirar cebola, ponto da carne..."></textarea>
          </div>
        </div>
        <div class="modal-footer bg-light">
          <div class="d-flex w-100 justify-content-between align-items-center">
            <div class="font-weight-bold" style="font-size: 18px;" id="lblTotalModal">R$ 0,00</div>
            <button type="button" class="btn btn-primary font-weight-bold" onclick="pdv.method.confirmarAdicaoCarrinho()">
              <i class="fas fa-plus mr-1"></i> Adicionar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/jquery.min.js"></script>
  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/app.js?v=2"></script>
  <script src="./js/pdv.js?v=2"></script>

  <!-- Container para Toasts Dinâmicos -->
  <div class="toast-container-pdv" id="containerToastsPdv"></div>
</body>
</html>
