<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <title>Menu Creator</title>
  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/fontawesome.css">
  <link rel="stylesheet" href="./css/animate.css">
  <link rel="stylesheet" href="./css/main.css">

  <link rel="icon" href="./img/logo.ico" type="x-icon">
  <link rel="shortcut icon" href="./img/logo.ico" type="x-icon">
  <meta property="og:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta property="og:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta property="og:image" content="https://menucreator.com.br/img/logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta name="twitter:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta name="twitter:image" content="https://menucreator.com.br/img/logo.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P70972ZVPQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P70972ZVPQ');
  </script>
</head>
<body>

  <!-- loader-full -->
  <div class="loader-full hidden">
    <img src="./img/loader.png" width="100">
  </div>

  <div class="bg-top"> </div>

  <header class="width-fix mt-5">
    <div class="card">
      <div class="d-flex">
        <figure class="container-img" id="imgLogoEmpresa"></figure>

        <div class="infos">
          <h1><b id="lblNomeEmpresa"></b></h1>
          <div class="infos-sub">
            <div class="status-open hidden" id="boxStatusLoja">
              <div class="status-linha-1">
                <i class="fa fa-clock"></i>
                <span id="lblLojaAberta"></span>
              </div>
              <small id="lblStatusComplemento" class="status-complemento"></small>
            </div>

            <a href="./sobre.html" class="link">
              ver mais
            </a>
          </div>
        </div>
      </div>
    </div>
  </header>
  <section class="width-fix mt-3 mb-3">
    <div class="search-box">    
      <i class="fas fa-search search-icon"></i>
      <input
        type="text"
        id="inputBuscaProduto"
        class="form-control search-input"
        placeholder="Buscar pizza, hambúrguer, refrigerante..."
      />
    </div>
  </section>

  <section class="lista width-fix mt-0 pb-2 hidden" id="secaoAnuncios">
    <!-- banners gerados por JS -->
  </section>

  <section class="categoria">
    <div class="width-fix">
      <div class="container-menu" id="listaCategorias"></div>
    </div>
  </section>

  <section class="lista width-fix mt-0 pb-2" id="secaoDestaques"></section>
  <section class="lista width-fix mt-0 pb-2 hidden" id="secaoAdicionaisHome"></section>
  <section class="lista width-fix mt-0 pb-5" id="listaItensCardapio"></section>

  <section class="menu-bottom" id="menu-bottom">

    <a href="./index.html" class="menu-bottom-item active">
      <i class="fas fa-book-open"></i><br>
      <small>Cardápio</small>
    </a>

    <a href="./pedido.html" class="menu-bottom-item">
      <i class="fas fa-utensils"></i><br>
      <small>Pedido</small>
    </a>

    <a href="./carrinho.html" class="menu-bottom-item">
      <span id="icone-carrinho-vazio">
        <i class="fas fa-shopping-cart"></i>
      </span>
      <span id="total-carrinho" class="badge-total-carrinho hidden"></span>
      <br>
      <small>Carrinho</small>
    </a>

    <a href="./perfil.html" class="menu-bottom-item" id="btnPerfilUsuario">
      <i class="fas fa-user-circle"></i><br>
      <small>Perfil</small>
    </a>

  </section>

  <section class="menu-bottom disabled hidden" id="menu-bottom-closed">
    <div>
      <p class="mb-0"><b>Loja fechada no momento</b></p>
      <small id="lblMenuFechadoInfo">Confira nosso horário de atendimento</small>
    </div>
  </section>

  
  <script type="text/javascript" src="./js/app.js"></script>
  <script type="text/javascript" src="./js/cardapio.js"></script>
  <script type="text/javascript" src="./js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="./painel/js/icones-categoria.js"></script>

</body>
</html>
