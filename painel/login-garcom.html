<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Garçom - Menu Creator</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/fontawesome.css">
  <link rel="stylesheet" href="../css/animate.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="./css/painel.css">

  <link rel="icon" href="../img/logo.ico" type="x-icon">
  <link rel="shortcut icon" href="../img/logo.ico" type="x-icon">
  <meta property="og:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta property="og:description"
    content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta property="og:image" content="https://menucreator.com.br/img/logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta name="twitter:description"
    content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta name="twitter:image" content="https://menucreator.com.br/img/logo.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P70972ZVPQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'G-P70972ZVPQ');
  </script>
</head>

<body>
  <div id="container-mensagens" class="container-mensagens"></div>

  <section class="login">
    <div class="card card-login">
      <img src="../img/logo.png" width="100" alt="logo-pizzaria">
      <h6 class="text-center mt-3 mb-4 text-muted">Acesso Garçom</h6>

      <div class="form-group mb-2">
        <span class="icon-form">
          <i class="fas fa-envelope"></i>
        </span>
        <input id="txtEmailLogin" type="email" class="form-control" placeholder="e-mail" />
      </div>
      <div class="form-group mb-3 position-relative">
        <span class="icon-form">
          <i class="fas fa-lock"></i>
        </span>
        <input id="txtSenhaLogin" type="password" class="form-control" placeholder="senha" />
        <span id="btnToggleSenhaPainel" class="icon-form-right"
          style="cursor: pointer; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; color: #999;">
          <i class="fas fa-eye"></i>
        </span>
      </div>
      <a id="btnLogin" href="#" class="btn btn-yellow btn-login mt-4">Fazer login</a>
    </div>
  </section>


  <script type="text/javascript" src="../js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="../js/app.js"></script>
  <script type="text/javascript" src="./js/login-garcom.js"></script>


</body>

</html>
