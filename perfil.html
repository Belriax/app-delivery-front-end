<body>

<section class="login">
  <div class="card card-login animate__animated animate__fadeInUp">

    <a href="./index.html" class="btn-voltar">
      <i class="fas fa-arrow-left"></i>
    </a>

    <!-- loader-full -->
    <div class="loader-full hidden">
      <img src="./img/loader.png" width="100">
    </div>
    

    <img src="./img/logo.png" width="96" alt="Logo">

    <h5 id="lblNomeCliente">Meu perfil</h5>
    <p class="subtitle" id="lblTelefoneCliente"></p>

    <div class="row mt-3">
      <div class="col-6">
        <div class="perfil-box">
          <i class="fas fa-star"></i>
          <small>Pontos</small>
          <h4 id="lblPontosCliente">0</h4>
        </div>
      </div>

      <div class="col-6">
        <div class="perfil-box">
          <i class="fas fa-coins"></i>
          <small>Cashback</small>
          <h4 id="lblCashbackCliente">R$ 0,00</h4>
        </div>
      </div>
    </div>

    <a href="./historico.html" class="btn btn-yellow btn-login mt-4">
      <i class="fas fa-list-alt"></i> &nbsp; Meu histórico
    </a>

    <a href="#" id="btnSairCliente" class="link mt-3 d-block">
      Sair da conta
    </a>

  </div>
</section>
