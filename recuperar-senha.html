<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nova Senha</title>

  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/fontawesome.css">
  <link rel="stylesheet" href="./css/animate.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/usuario-auth.css">

  <link rel="icon" href="./img/logo.ico" type="x-icon">
  <link rel="shortcut icon" href="./img/logo.ico" type="x-icon">
  <meta property="og:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta property="og:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta property="og:image" content="https://menucreator.com.br/img/logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta name="twitter:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta name="twitter:image" content="https://menucreator.com.br/img/logo.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P70972ZVPQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P70972ZVPQ');
  </script>
</head>

<body>

  <!-- loader-full -->
  <div class="loader-full hidden">
    <img src="./img/loader.png" width="100">
  </div>

  <section class="login">
    <div class="card card-login animate__animated animate__fadeInUp">
      <img src="./img/logo.png" width="96" alt="Logo">

      <h5>Definir Nova Senha</h5>
      <p class="subtitle">
        Crie uma nova senha para sua conta.
      </p>

      <div class="form-group mb-3 position-relative">
        <span class="icon-form">
          <i class="fas fa-lock"></i>
        </span>
        <input
          id="txtSenha"
          type="password"
          class="form-control"
          placeholder="Nova senha"
        />
        <span id="btnToggleSenha" class="icon-form-right" style="cursor: pointer; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; color: #999;">
          <i class="fas fa-eye"></i>
        </span>
      </div>

      <div class="form-group mb-3 position-relative">
        <span class="icon-form">
          <i class="fas fa-lock"></i>
        </span>
        <input
          id="txtConfirmarSenha"
          type="password"
          class="form-control"
          placeholder="Confirmar nova senha"
        />
        <span id="btnToggleConfirmarSenha" class="icon-form-right" style="cursor: pointer; position: absolute; right: 15px; top: 50%; transform: translateY(-50%); z-index: 10; color: #999;">
          <i class="fas fa-eye"></i>
        </span>
      </div>

      <a id="btnSalvar" href="#" class="btn btn-yellow btn-login mt-4">
        Salvar e Entrar
      </a>

    </div>
  </section>

  <script src="./js/bootstrap.bundle.min.js"></script>
  <script src="./js/app.js"></script>
  <script src="./js/usuario-recuperar-senha.js"></script>

</body>
</html>
