<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro</title>

  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/fontawesome.css">
  <link rel="stylesheet" href="./css//usuario-auth.css">

  <link rel="icon" href="./img/logo.ico" type="x-icon">
  <link rel="shortcut icon" href="./img/logo.ico" type="x-icon">
  <meta property="og:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta property="og:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta property="og:image" content="https://menucreator.com.br/img/logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cardápio Digital - Faça seu pedido!" />
  <meta name="twitter:description" content="Acesse nosso cardápio digital, conheça nossos produtos e faça seu pedido online de forma rápida e prática." />
  <meta name="twitter:image" content="https://menucreator.com.br/img/logo.png" />

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P70972ZVPQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-P70972ZVPQ');
  </script>
</head>

<body>

  <!-- loader-full -->
  <div class="loader-full hidden">
    <img src="./img/loader.png" width="100">
  </div>

<section class="login">
  <div class="card card-login animate__animated animate__fadeInUp">
      <a href="./index.html" class="btn-voltar">
        <i class="fas fa-arrow-left"></i>
      </a>

    <img src="./img/logo.png" width="96" alt="Logo">

    <h5>Criar sua conta</h5>
    <p class="subtitle">
      Cadastre-se para acessar cupons exclusivos.
    </p>

    <div class="form-group mb-3">
      <span class="icon-form">
        <i class="fas fa-user"></i>
      </span>
      <input
        id="txtNome"
        type="text"
        class="form-control"
        placeholder="Seu nome"
      />
    </div>

    <div class="form-group mb-3">
      <span class="icon-form">
        <i class="fas fa-phone"></i>
      </span>
      <input
        id="txtTelefone"
        type="tel"
        class="form-control"
        placeholder="Seu telefone"
      />
    </div>

    <div class="form-group mb-3">
      <span class="icon-form">
        <i class="fas fa-lock"></i>
      </span>
      <input
        id="txtSenha"
        type="password"
        class="form-control"
        placeholder="Crie uma senha"
      />
    </div>

    <a id="btnCadastrar" href="#" class="btn btn-yellow btn-login mt-3">
      Criar conta
    </a>

    <div class="auth-link-area">
      Já tem cadastro?
      <a href="./login.html">Fazer login</a>
    </div>

  </div>
</section>

<script src="./js/app.js"></script>
<script src="./js/cadastro.js"></script>

</body>
</html>
