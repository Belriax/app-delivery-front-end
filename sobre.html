<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Creator - Sobre</title>
  <link rel="icon" href="./img/logo.ico" type="x-icon">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin=""/>

  <link rel="stylesheet" href="./css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/fontawesome.css">
  <link rel="stylesheet" href="./css/animate.css">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <!-- loader-full -->
  <div class="loader-full hidden">
    <img src="./img/loader.png" width="100">
  </div>

  <div class="bg-top sobre"></div>

  <header class="width-fix mt-3">
    <div class="card">
      <div class="d-flex">

        <a href="./index.html" class="container-voltar">
          <i class="fas fa-arrow-left"></i>
        </a>
        <div class="infos text-center">
          <h1 class="mb-0"><b>Sobre a loja</b></h1>
        </div>
      </div>
    </div>
  </header>

  <section class="width-fix mt-5 mb-4">
    <div class="card">
      <div class="d-flex">
        
        <div class="container-img-sobre" id="imgLogoEmpresa"></div>

          <div class="infos">
            <h1 class="title-sobre"><b id="lblNomeEmpresa"></b></h1>
            <div class="infos-sub">
              <p class="sobre mb-2" id="lblSobreEmpresa"></p>
            </div>
          </div>
      </div>
    </div>
  </section>

  <section class="lista width-fix mt-5 pb-5">
    <div class="container-group mb-4">
      <p class="title-categoria mb-0">
        <i class="fas fa-map-marker-alt"></i>&nbsp;<b>Endereço</b>
      </p>
      <div class="card mt-2">
        <p class="normal-text mb-0" id="lblEnderecoEmpresa"></p>
      </div>

      <div id="mapContainer" class="hidden mt-3">
        <div id="map" style="width: 100%; height: 200px; border-radius: 12px;"></div>
      </div>
    </div>

    <div class="container-group mb-4 hidden" id="tiposEntrega">
      <p class="title-categoria mb-2">
        <i class="fas fa-truck"></i>&nbsp;<b>Entrega e retirada</b>
      </p>
      <div id="listaTiposEntrega" class="delivery-options-grid"></div>
    </div>

    <div class="container-group mb-4 hidden" id="horarioFuncionamento">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <p class="title-categoria mb-0">
          <i class="fas fa-clock"></i>&nbsp;<b>Horário de funcionamento</b>
        </p>
        <span id="statusLojaBadge" class="store-status-badge closed hidden">Fechado</span>
      </div>

      <div id="horariosLista" class="schedule-list"></div>
    </div>

    <div class="container-group mb-5 hidden" id="formasPagamento">
      <p class="title-categoria mb-2">
        <i class="fas fa-coins"></i>&nbsp;<b>Formas de pagamento</b>
      </p>

      <div id="listaFormasPagamento" class="payment-grid"></div>
    </div>
  </section>

  <a href="./index.html" class="btn btn-yellow btn-full voltar" id="menu-bottom">
    Voltar para o cardápio
  </a>

  <section class="menu-bottom disabled hidden" id="menu-bottom-closed">
    <div>
      <p class="mb-0"><b>Loja fechada no momento</b></p>
      <small id="lblMenuFechadoInfo">Confira nosso horário de atendimento</small>
    </div>
  </section>


  <script type="text/javascript" src="./js/bootstrap.bundle.min.js"></script>
  <script type="text/javascript" src="./js/app.js"></script>
  <script type="text/javascript" src="./js/sobre.js"></script>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
  </script>


</body>
</html>
